[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zinohk"
version = "0.1.0"
description = "Brain-inspired AI — sparse, async, spike-based"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "networkx>=3.2.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
kaggle = [
    "torch>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["zinohk*"]
